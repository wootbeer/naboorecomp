# The scheduler (func_40022960) sends the frame loop its once-a-VI tick, while
# the frame loop is waiting for it (the flag at 0x4004D9F0), to a queue of one
# (0x400800E0), and blocks if the queue is full. Skipping an intro stops the
# frame loop's thread as it waits, flag set; the intro's manager clears the
# flag, but here not before a second tick: the scheduler blocked for good, and
# with it the sound engine the manager waits on (STATUS.md round 20). A tick
# nobody's waiting for is dropped instead (OS_MESG_NOBLOCK).
[[patches.instruction]]
func = "func_40022960"
vram = 0x40022C38
value = 0x00003021

# The opening crawl (func_410A0B50) can be skipped with A or Start only once
# game flag 0x41 is set (func_410A6948(0x41), stored at $sp+0xF0): from the
# second viewing on, it seems. Always allowed here, to get into the game
# faster (STATUS.md round 21): $sp stands in for the flag, and is never 0.
[[patches.instruction]]
func = "func_410A0B50"
vram = 0x410A0CD4
value = 0xAFBD00F0

# The same for the intro (func_4108ED40: the logos, through to the title),
# with game flag 0x42 at $sp+0x2C.
[[patches.instruction]]
func = "func_4108ED40"
vram = 0x4108EEC0
value = 0xAFBD002C

