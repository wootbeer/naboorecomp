# func_410112B0 walks the level's portals from the camera, keeping a screen
# rectangle for each cell that it later uses as the scissor for what's drawn in
# that cell. Here it has just worked out the horizontal scale of its own
# projection (0x40060064, from the 4:3 screen); for widescreen it's narrowed by
# the same factor as the camera's (src/game/widescreen.cpp, STATUS.md round 22),
# or walls past the 4:3 cell rectangles are cut off.
[[patches.hook]]
func = "func_410112B0"
before_vram = 0x41011648
text = "    { extern void naboo_widen_portals(uint8_t *rdram); naboo_widen_portals(rdram); }"

# The open levels' terrain is made for the view's footprint on the ground:
# func_4104E8CC reads the camera's eye and four far corners (+0x80 and +0x8C in
# the camera, a0 + 4), set for the 4:3 TV shape by func_41024064. They're
# widened like the camera for this function only, and put back as it returns:
# four other systems read the same corners (func_410244B8, func_41027264,
# func_4102CE20, func_40023BB0), and widening them for everything corrupted
# the game's memory in level 2 (src/game/widescreen.cpp, STATUS.md round 23).
[[patches.hook]]
func = "func_4104E8CC"
before_vram = 0x4104E8CC
text = "    { extern void naboo_widen_terrain(uint8_t *rdram, gpr camera); naboo_widen_terrain(rdram, MEM_W(4, ctx->r4)); }"

[[patches.hook]]
func = "func_4104E8CC"
before_vram = 0x4104EA94
text = "    { extern void naboo_restore_terrain(uint8_t *rdram); naboo_restore_terrain(rdram); }"

# The terrain's row tables: one 0x4E0-byte block holding four tables of each row's first and
# last column, two of 100 rows for the fine level of detail and two of 56 for the coarse one
# (pointers at 0x40099128-0x40099134). The game marks three rows past the last one it covers,
# so a footprint reaching the coarse level's row 53 writes entry 56 of the last table: the
# next heap block's header. The 4:3 footprint stops at about row 47; the widescreen one gets
# there (the level 2 freezes and crashes, STATUS.md round 26). Here the block is 0x1000 bytes
# and each table 256 rows: the four instructions that size and place them in func_4104EA9C.
[[patches.instruction]]
func = "func_4104EA9C"
vram = 0x4104EB78
value = 0x24041000 # addiu $a0, $zero, 0x1000 (0x4E0)

[[patches.instruction]]
func = "func_4104EA9C"
vram = 0x4104EB8C
value = 0x24430400 # addiu $v1, $v0, 0x400 (0x190)

[[patches.instruction]]
func = "func_4104EA9C"
vram = 0x4104EB98
value = 0x24430800 # addiu $v1, $v0, 0x800 (0x320)

[[patches.instruction]]
func = "func_4104EA9C"
vram = 0x4104EBA8
value = 0x24420C00 # addiu $v0, $v0, 0xC00 (0x400)

# func_4000BB00 writes a scissor from a cell's screen rectangle (a1). Rarely, in
# open levels, it has been handed a pointer that isn't in RAM, and the game
# crashed or froze (STATUS.md round 22). Until the cause is found, such a
# rectangle is replaced by the whole screen's (0x4004CD28) and reported once.
[[patches.hook]]
func = "func_4000BB00"
before_vram = 0x4000BB00
text = "    { extern void naboo_check_scissor_rect(uint8_t *rdram, recomp_context *ctx); naboo_check_scissor_rect(rdram, ctx); }"

# NABOO_HEAP_CHECK=2 checks the heap on every allocation (src/game/heap_check.cpp).
[[patches.hook]]
func = "func_4000193C"
before_vram = 0x4000193C
text = "    { extern void naboo_heap_check_alloc(uint8_t *rdram); naboo_heap_check_alloc(rdram); }"

# The file loader's manager loop, before its osYieldThread: a change in its request slots
