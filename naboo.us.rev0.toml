# N64Recomp config for Star Wars Episode I: Battle for Naboo (USA).
# See STATUS.md for how each entry was found.

[input]
# The boot stub at ROM 0x1000 (linked at 0x40000400, run from 0x80000400 by
# IPL3): sets the stack, maps the TLB and jumps to main() (func_4003A4DC).
# Its TLB setup is patched out below (STATUS.md round 4).
entrypoint = 0x40000400
output_func_path = "RecompiledFuncs"
rom_file_path = "Battle for Naboo (USA).z64"
symbols_file_path = "NabooSyms/naboo.us.rev0.syms.toml"
# Factor 5's vector math sets the FR bit in Status (e.g. func_41002400) to use
# all 32 FPU registers as doubles, then clears it again (STATUS.md round 4).
uses_mips3_float_mode = true

[patches]
# TLB setup: the port has no TLB, its address masking stands in for the two
# mappings (lib-patches/N64Recomp, STATUS.md round 4).
stubs = ["func_40000880", "func_40000F08",
    # The TLB-miss handler (demand paging of the 0x41000000 segment) and the
    # code that installs it at the exception vectors.
    "func_400008F4",
    # In .data: allocates the data cache's lines over a buffer (cache 0x0D) so
    # a following DMA doesn't read memory first. Nothing to do on a host.
    "func_4004E880",
    # libultra's osInitialize, never called (main() calls Factor 5's copy,
    # 0x4003A108, which the runtime replaces), STATUS.md round 5.
    "func_400408C0"]
ignored = []

# main() right after its osInitialize call: what the game's own osInitialize
# sets up besides the hardware (osClockRate * 3/4, osViClock), which the
# runtime's replacement doesn't do (src/game/os_init.cpp, STATUS.md round 5).
[[patches.hook]]
func = "func_4003A4DC"
before_vram = 0x4003A504
text = "    { extern void naboo_init_os(uint8_t *rdram); naboo_init_os(rdram); }"

# Busy-waits that rely on an interrupt-driven thread preempting them. Game
# threads only switch at OS calls here, so each loop delivers pending events
# and lets a higher-priority thread run (STATUS.md round 12).
# func_40037A60: waits N frames, spinning until the VI side counts the
# halfword at 0x40090512 down to 0.
[[patches.hook]]
func = "func_40037A60"
before_vram = 0x40037A7C
text = "    { extern void yield_self_1ms(uint8_t *rdram); yield_self_1ms(rdram); }"

# func_40033584: whether all of the sound engine's voices (0x60-byte entries
# at *0x40080390, active flag at +8) have finished; $s1 is set while any
# hasn't. Its five callers (the title screen's setup among them, after the
# Factor 5 logo) spin on it, waiting for the audio thread to clear the flags
# (STATUS.md round 18).
[[patches.hook]]
func = "func_40033584"
before_vram = 0x40033600
text = "    if (ctx->r17 != 0) { extern void yield_self_1ms(uint8_t *rdram); yield_self_1ms(rdram); }"

# func_400376A8: the sound engine's once-a-VI pass, which refills the audio
# buffers played since the last one. Notes where its cursor starts, for
# src/game/audio_ring.cpp (STATUS.md round 20).
[[patches.hook]]
func = "func_400376A8"
before_vram = 0x400376A8
text = "    { extern void naboo_audio_pass_start(uint8_t *rdram); naboo_audio_pass_start(rdram); }"

# func_400376A8, the sound engine's once-a-VI pass: it waits for the last
# batch of stream reads, starts a new one, moves the reads streams asked for
# since into it, renders the audio buffers the AI has played, then hands the
# batch to the file loader (func_40034DB0). With nothing to render it skips to
# here, past that last step, and the next pass starts a new batch: the reads
# were lost, though their streams had been told they were done. The speech
# decoder (cutscenes, craft select) then read chunks that never arrived, and
# its filter blew up into loud noise. On the N64 the AI always takes a buffer
# or two between passes; here it can take none (STATUS.md round 21). So a
# batch that's still waiting is handed over here.
[[patches.hook]]
func = "func_400376A8"
before_vram = 0x40037998
text = "    if ((MEM_HU(0X2D6, (gpr)(int32_t)0x40080000) != 0) && (MEM_BU(0X42C, (gpr)(int32_t)0x40090000) == 0)) { recomp_context naboo_saved = *ctx; func_40034DB0(rdram, ctx); *ctx = naboo_saved; }"

# func_400236E4 has no return: on the N64 it runs straight on into
# func_40023734, which is also called on its own. Recompiled functions don't
# fall through into the next one, so do it here (from its last instruction).
[[patches.hook]]
func = "func_400236E4"
before_vram = 0x40023730
text = "    ctx->r14 = S32(0XC00 << 16); func_40023734(rdram, ctx); return;"

# Debugging aid: saves RAM at chosen graphics tasks (NABOO_DUMP_GFX, see
# src/game/gfx_dump.cpp). func_40023558 is the game's RSP task launcher.
[[patches.hook]]
func = "func_40023558"
before_vram = 0x40023558
text = "    { extern void naboo_gfx_dump(uint8_t *rdram); naboo_gfx_dump(rdram); }"

# Boot stub: no COP0 (Wired, Context, Index), and fall through to its
# `j func_4003A4DC` at 0x4000044C instead of jumping there through the
# TLB-mapped address in $t0.
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x4000040C
value = 0x00000000

